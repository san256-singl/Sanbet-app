workflows:
  flutter-workflow:
    name: Sanbet APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: defaul
      dcripts:
      - name: Create Android folder
        script: flutter create . --platforms=android
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.app
